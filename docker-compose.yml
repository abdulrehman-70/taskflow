services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: taskflow_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: taskflow_mysql
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taskflow_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

  redis:
    image: redis:alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: taskflow_horizon
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./src:/var/www
    depends_on:
      - app
      - redis
      - mysql
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: taskflow_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data: